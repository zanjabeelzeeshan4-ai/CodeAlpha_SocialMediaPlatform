<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | CodeAlpha Social Media</title>

    <link
        rel="stylesheet"
        href="./css/auth.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <a
                    href="./index.html"
                    class="auth-logo"
                >
                    CodeAlpha
                </a>

                <h1>Create Account</h1>

                <p>
                    Join the CodeAlpha community
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Create Account
                </button>

            </form>


            <p
                id="authMessage"
                class="auth-message"
            ></p>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="./login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="./js/auth.js"></script>

</body>

</html>
