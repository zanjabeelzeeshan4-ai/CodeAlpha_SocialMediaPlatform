<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile - CodeAlpha</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <link
        rel="stylesheet"
        href="./css/profile.css"
    >

</head>
<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="main-header">

        <div class="container header-content">

            <a
                href="./index.html"
                class="logo"
            >
                CodeAlpha
            </a>


            <nav class="main-nav">

                <a href="./index.html">
                    Home
                </a>

                <a href="./profile.html">
                    Profile
                </a>
<a href="#">Home</a>
                <button
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </nav>

        </div>

    </header>


    <!-- ==========================================
         PROFILE
    =========================================== -->

    <main>

        <section class="profile-section">

            <div class="container">

                <div
                    id="profileMessage"
                    class="profile-message"
                ></div>


                <!-- ==========================================
                     PROFILE CARD
                =========================================== -->

                <div class="profile-card">

                    <div class="profile-top">

                        <div
                            id="profileImageContainer"
                            class="profile-image-container"
                        >
                            <!-- Profile image will appear here -->
                        </div>


                        <div class="profile-main-info">

                            <h1 id="profileName">
                                Loading...
                            </h1>

                            <p id="profileUsername">
                                @username
                            </p>

                            <p
                                id="profileBio"
                                class="profile-bio"
                            >
                                Loading bio...
                            </p>


                            <div class="profile-stats">

                                <div class="profile-stat">

                                    <strong
                                        id="followersCount"
                                    >
                                        0
                                    </strong>

                                    <span>
                                        Followers
                                    </span>

                                </div>


                                <div class="profile-stat">

                                    <strong
                                        id="followingCount"
                                    >
                                        0
                                    </strong>

                                    <span>
                                        Following
                                    </span>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- ==========================================
                         EDIT PROFILE
                    =========================================== -->

                    <div class="edit-profile-section">

                        <h2>
                            Edit Profile
                        </h2>


                        <form id="profileForm">

                            <div class="form-group">

                                <label for="profileNameInput">
                                    Name
                                </label>

                                <input
                                    type="text"
                                    id="profileNameInput"
                                    maxlength="50"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="profileBioInput">
                                    Bio
                                </label>

                                <textarea
                                    id="profileBioInput"
                                    rows="4"
                                    maxlength="160"
                                    placeholder="Tell people about yourself..."
                                ></textarea>

                            </div>


                            <div class="form-group">

                                <label for="profileImageInput">
                                    Profile Image URL
                                </label>

                                <input
                                    type="url"
                                    id="profileImageInput"
                                    placeholder="https://example.com/profile.jpg"
                                >

                            </div>


                            <button
                                type="submit"
                                id="updateProfileBtn"
                                class="update-profile-btn"
                            >
                                Update Profile
                            </button>

                        </form>


                        <p
                            id="updateProfileMessage"
                            class="update-profile-message"
                        ></p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="./js/profile.js"></script>

</body>

</html>
