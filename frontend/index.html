<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CodeAlpha Social Media</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="main-header">

        <div class="container header-content">

            <a
                href="#"
                class="logo"
            >
                CodeAlpha Socianex.
            </a>

            <nav class="main-nav">

                <a href="#">Home</a>

                
<a href="./profile.html">
                    Profile
                </a>

                <button
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </nav>

        </div>

    </header>


    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main>

        <section class="hero-section">

            <div class="container">

                <h1>
                    Welcome to CodeAlpha Social Media
                </h1>

                <p>
                    Connect, share posts, follow users
                    and interact with the community.
                </p>

            </div>

        </section>


        <!-- ==========================================
             FEED
        =========================================== -->

        <!-- <section class="feed-section">

            <div class="container">

                <h2>Latest Posts</h2>

                <div id="postsContainer">

                    

                </div>

            </div>

        </section> -->

        <section class="feed-section">

    <div class="container">

        <!-- ==========================================
             CREATE POST
        =========================================== -->

        <div class="create-post-card">

            <h2>Create a Post</h2>

            <form id="createPostForm">

                <div class="form-group">

                    <label for="postContent">
                        What's on your mind?
                    </label>

                    <textarea
                        id="postContent"
                        name="content"
                        rows="5"
                        maxlength="1000"
                        placeholder="Share something with the community..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="postImage">
                        Image URL
                        <span>(Optional)</span>
                    </label>

                    <input
                        type="url"
                        id="postImage"
                        name="image"
                        placeholder="https://example.com/image.jpg"
                    >

                </div>


                <button
                    type="submit"
                    class="create-post-btn"
                >
                    Create Post
                </button>

            </form>


            <p
                id="createPostMessage"
                class="create-post-message"
            ></p>

        </div>


        <!-- ==========================================
             LATEST POSTS
        =========================================== -->

        <h2 class="feed-title">
            Latest Posts
        </h2>

        <div id="postsContainer">

            <!-- Posts will be loaded here -->

        </div>

    </div>

</section>



    </main>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="./js/app.js"></script>

</body>

</html>
