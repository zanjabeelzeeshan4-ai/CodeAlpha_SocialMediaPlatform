<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | CodeAlpha Social Media</title>

    <link
        rel="stylesheet"
        href="./css/auth.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <a
                    href="./index.html"
                    class="auth-logo"
                >
                    CodeAlpha
                </a>

                <h1>Welcome Back</h1>

                <p>
                    Login to your account
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>

            </form>


            <p
                id="authMessage"
                class="auth-message"
            ></p>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="./register.html">
                        Create account
                    </a>
                </p>

            </div>

        </div>

    </main>


    <script src="./js/auth.js"></script>

</body>

</html>
